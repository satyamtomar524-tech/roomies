name: Project checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/app.js
      - run: node --check web/flat.js
      - run: node --check web/costs.js
      - run: node --check web/browser.js
      - run: node --check web/browser-worker.mjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - name: Use the runner's installed Chrome
        run: |
          browser_path="$(command -v google-chrome)"
          test -n "$browser_path"
          echo "ROOMMATE_BROWSER_PATH=$browser_path" >> "$GITHUB_ENV"
      - run: npm run test:browser
      - run: python scripts/build_browser.py
      - run: npm run test:public
